<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Click Capture</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            min-width: 440px;
            min-height: 100vh;
            background: #f5f7fa;
            overflow: hidden;
        }

        .container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: white;
        }

        /* Header */
        .header {
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 36px;
            height: 36px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .title h2 {
            font-size: 18px;
            font-weight: 600;
        }

        .title p {
            font-size: 12px;
            opacity: 0.9;
            margin-top: 2px;
        }

        .controls {
            display: flex;
            gap: 8px;
        }

        .btn {
            width: 36px;
            height: 36px;
            border: none;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        /* Stats */
        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            padding: 16px;
            background: white;
            border-bottom: 1px solid #eaeaea;
        }

        .stat-card {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-icon {
            font-size: 20px;
            color: #667eea;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 20px;
            font-weight: bold;
            color: #333;
        }

        .stat-label {
            font-size: 12px;
            color: #666;
            margin-top: 4px;
        }

        /* Filters */
        .filters {
            display: flex;
            padding: 12px 16px;
            gap: 8px;
            background: white;
            border-bottom: 1px solid #eaeaea;
            overflow-x: auto;
        }

        .filter-btn {
            padding: 6px 12px;
            border: 1px solid #e0e0e0;
            background: white;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            color: #666;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .filter-btn:hover {
            border-color: #667eea;
            color: #667eea;
        }

        .filter-btn.active {
            background: #667eea;
            border-color: #667eea;
            color: white;
        }

        /* Clicks List */
        .clicks-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-icon {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .empty-text {
            font-size: 14px;
            margin-bottom: 8px;
        }

        .empty-subtext {
            font-size: 12px;
            color: #aaa;
        }

        /* Click Item */
        .click-item {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 12px;
            border-left: 4px solid #667eea;
            transition: all 0.2s;
        }

        .click-item:hover {
            background: #f0f2f5;
            transform: translateY(-1px);
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .click-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
        }

        .click-text {
            font-weight: 500;
            color: #333;
            font-size: 14px;
            max-width: 70%;
            word-break: break-word;
        }

        .click-type {
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .type-link { background: #4dabf7; color: white; }
        .type-button { background: #40c057; color: white; }
        .type-input { background: #fab005; color: white; }
        .type-div { background: #7950f2; color: white; }
        .type-span { background: #e8590c; color: white; }
        .type-other { background: #868e96; color: white; }

        .click-details {
            font-size: 12px;
            color: #666;
            margin-bottom: 8px;
        }

        .detail-row {
            margin-bottom: 4px;
            display: flex;
            align-items: flex-start;
        }

        .detail-label {
            min-width: 60px;
            color: #888;
            font-weight: 500;
        }

        .detail-value {
            flex: 1;
            word-break: break-all;
        }

        .click-meta {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #999;
        }

        /* Footer */
        .footer {
            padding: 12px 16px;
            background: white;
            border-top: 1px solid #eaeaea;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .time-info {
            font-size: 12px;
            color: #666;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .footer-btn {
            padding: 6px 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .footer-btn:hover {
            background: #5a6fd8;
        }

        .footer-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Scrollbar */
        .clicks-container::-webkit-scrollbar {
            width: 6px;
        }

        .clicks-container::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 3px;
        }

        .clicks-container::-webkit-scrollbar-thumb {
            background: #ccc;
            border-radius: 3px;
        }

        .clicks-container::-webkit-scrollbar-thumb:hover {
            background: #aaa;
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="logo">
                <div class="logo-icon">
                    <i class="fas fa-mouse-pointer"></i>
                </div>
                <div class="title">
                    <h2>Click Capture</h2>
                    <p>Capturing all clicks</p>
                </div>
            </div>
            <div class="controls">
                <button class="btn" id="toggleBtn" title="Pause/Resume">
                    <i class="fas fa-pause"></i>
                </button>
                <button class="btn" id="clearBtn" title="Clear All">
                    <i class="fas fa-trash"></i>
                </button>
            </div>
        </div>

        <!-- Stats -->
        <div class="stats">
            <div class="stat-card">
                <div class="stat-icon">
                    <i class="fas fa-mouse-pointer"></i>
                </div>
                <div class="stat-value" id="totalCount">0</div>
                <div class="stat-label">Total Clicks</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">
                    <i class="fas fa-link"></i>
                </div>
                <div class="stat-value" id="linkCount">0</div>
                <div class="stat-label">Links</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">
                    <i class="fas fa-square"></i>
                </div>
                <div class="stat-value" id="buttonCount">0</div>
                <div class="stat-label">Buttons</div>
            </div>
        </div>

        <!-- Filters -->
        <div class="filters">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="link">Links</button>
            <button class="filter-btn" data-filter="button">Buttons</button>
            <button class="filter-btn" data-filter="input">Inputs</button>
            <button class="filter-btn" data-filter="div">Divs</button>
            <button class="filter-btn" data-filter="span">Spans</button>
        </div>

        <!-- Clicks List -->
        <div class="clicks-container" id="clicksList">
            <div class="empty-state">
                <div class="empty-icon">
                    <i class="fas fa-mouse-pointer"></i>
                </div>
                <div class="empty-text">Click anywhere to start capturing</div>
                <div class="empty-subtext">All clicks will appear here in real-time</div>
            </div>
        </div>

        <!-- Footer -->
        <div class="footer">
            <div class="time-info">
                <i class="far fa-clock"></i>
                <span id="currentTime">--:--</span>
            </div>
            <div class="footer-actions">
                <button class="footer-btn" id="downloadAllBtn" title="Download Files">
                    <i class="fas fa-file-arrow-down"></i> Download Files
                </button>
                <button class="footer-btn" id="exportBtn">
                    <i class="fas fa-file-csv"></i> Export
                </button>
            </div>
        </div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
